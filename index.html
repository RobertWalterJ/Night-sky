<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Sky</title>
<meta http-equiv="refresh" content="0; url=sky/">
<style>body{margin:0;background:#000;color:#fff;font:18px/1.5 system-ui,sans-serif;display:grid;place-items:center;height:100vh}a{color:#7fd}</style>
</head><body><p>Night Sky has moved. <a href="sky/">Open it here</a>.</p>
<script>
/* Tidy up the old app that lived at this address. */
(async function () {
  try {
    var regs = await navigator.serviceWorker.getRegistrations();
    for (var r of regs) if (new URL(r.scope).pathname === '/Night-sky/') await r.unregister();
    for (var k of await caches.keys()) if (k.indexOf('nightsky-') === 0) await caches.delete(k);
  } catch (e) {}
  location.replace('sky/');
})();
</script></body></html>
